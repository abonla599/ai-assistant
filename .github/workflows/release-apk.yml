name: Release Android APK

# 打 tag 就出公开 Release：`git push origin v0.10` 之后，任何人都能用固定链接装包。
#
# 为什么不并进 build-apk.yml：那个文件带 `push.paths` 过滤（只在 android/** 变化时
# 出 artifact）。把 tags 和 paths 写在同一个 push 触发器里，paths 会不会把 tag 推送
# 一起挡掉，取决于 GitHub 的过滤语义——这种"能不能触发"的事不该靠猜，所以分开写。
# 两个文件重复的是二十来行 CI 装配步骤，不是产品逻辑。
#
# Release 是公开的（本仓是公开仓库），这正是想要的效果。
# 2026-09-25 起发的是**原生安卓客户端**（android-native/，Compose 全原生实现）：
# 用户决定推送版只发安卓版；旧的 WebView 壳（android/）退役不再发布，
# 浏览器网页版不受任何影响，照常从 https://ai.fenever.xyz/app/ 访问。
on:
  push:
    tags:
      - "v*"
  # 失败后从 UI 重跑即可：重跑保留原 tag，GITHUB_REF_NAME 仍是 v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # tag 与实际装进 APK 的版本号必须对上，否则发出去的 Release 名字会和包内
      # versionName 不一致，事后谁也说不清用户装的到底是哪一版。
      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          declared=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' android-native/app/build.gradle)
          tag=${GITHUB_REF_NAME#v}
          echo "build.gradle versionName=$declared  tag=$tag"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag 是 v$tag 但 build.gradle 写的是 $declared，两者必须一致"
            exit 1
          fi

      # 签名密钥从 Secrets 落盘。为什么这步必须先于构建、缺了就直接失败而不是退回去
      # 签一把新的：Android 覆盖安装判的是签名，不是版本号。之前这里跑 assembleDebug，
      # 而 runner 每次现造一把 debug keystore——实测 v0.15 与 v0.16 两个 Release 的
      # 证书 SHA-256 指纹就不相同，于是"检查更新"永远装不上，只能卸载重装。
      # 宁可发布失败，也不再发一把新钥匙签的包：那等于给所有老用户再造一次"必须重装"，
      # 而这件事一旦发生就收不回来。
      # 三步各查一件事，而且结论写在**步骤名**里。为什么不用 ::error:: 的 annotations：
      # 未鉴权调 /actions/runs/{id}/jobs 时整个 output 字段是空的（2026-09-21 实测），
      # 错误正文只有登录的人看得见。而这几步存在的意义恰恰是"红得让人看懂"——
      # 不用登录，看哪一步红了就知道该重贴哪个 secret。
      - name: "SIGNING KEY MISSING -> 没贴上来：secret APK_KEYSTORE_BASE64"
        env:
          KEY_B64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEY_B64:-}" ]; then
            echo "::error::缺少 secret APK_KEYSTORE_BASE64。没有钉住的签名密钥，这次构建"
            echo "::error::只能签出一把新钥匙，老用户装不上——所以宁可停在这里。"
            echo "::error::生成与填写办法见 tools/make-apk-keystore.ps1，然后到仓库"
            echo "::error::Settings -> Secrets and variables -> Actions -> New repository secret 贴进去。"
            exit 1
          fi
          printf '%s' "$KEY_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "APK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: "SIGNING KEY CORRUPTED -> 重贴 secret APK_KEYSTORE_BASE64（粘贴掉字了）"
        env:
          # 这不是秘密：它是那把密钥**文件**的 SHA-256，知道摘要推不出内容。它存在的理由
          # 是把"粘贴时坏了一个字符"从一次猜谜变成一句明说——base64 掉一个字符通常照样
          # 解得开，于是失败点会漂到后面的 keytool / gradle 上，报的是"口令不对"或
          # "签不出来"，谁也不会想到是复制粘贴的问题（v0.17 第一次就这么绕了一圈）。
          EXPECTED_SHA: 7b62bf68a3427963c6f8d8ecbe5fa6164458eb0020f3dc608216e14e1952c5a5
        run: |
          set -eu
          got=$(sha256sum "$RUNNER_TEMP/release.jks" | cut -d' ' -f1)
          if [ "$got" != "$EXPECTED_SHA" ]; then
            echo "::error::解出来的密钥与登记的指纹不一致：期望 $EXPECTED_SHA，实得 $got"
            echo "::error::这几乎总是粘贴时掉了或换了一个字符：打开 ai-assistant-keystore"
            echo "::error::目录里的 secrets-to-paste.txt，把 APK_KEYSTORE_BASE64 那一整行重抄覆盖。"
            exit 1
          fi

      - name: "SIGNING KEY UNREADABLE -> 重贴 secret APK_KEYSTORE_PASSWORD / APK_KEY_ALIAS"
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -uo pipefail
          # 显式关掉 -e。Actions 默认用 `bash -e` 跑 run 块：keytool 一失败整步就地中止，
          # 下面那些 ::error:: 一个都发不出来。第一次用它查案就是这么栽的——步骤红了、
          # 什么正文都没留下。
          set +e
          out=$("$JAVA_HOME/bin/keytool" -list -keystore "$APK_KEYSTORE" -storetype PKCS12 \
                  -storepass "$APK_KEYSTORE_PASSWORD" -alias "$APK_KEY_ALIAS" -v 2>&1)
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf '%s\n' "$out" | tail -6 | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::keytool: $line"; done
            echo "::error::密钥文件本身是对的（上一步刚核过指纹），读不出来只能是口令或 alias 不对"
            exit 1
          fi
          printf '%s\n' "$out" | grep -m1 'SHA256:' | tr -d ' \t' | sed 's/%/%25/g' \
            | while IFS= read -r line; do echo "::notice::pinned signing key: $line"; done

      - name: Assemble release APK
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          set -uo pipefail
          set +e                      # 同上：失败要能被翻译出来，而不是让 -e 抢着中止
          gradle -p android-native --no-daemon --stacktrace assembleRelease 2>&1 \
            | tee "$RUNNER_TEMP/assemble.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # 把 "What went wrong" 那一段搬进 annotations，理由与上一步相同
            awk '/What went wrong/{flag=1} /^BUILD FAILED/{flag=0} flag' "$RUNNER_TEMP/assemble.log" \
              | head -20 | sed 's/%/%25/g' \
              | while IFS= read -r line; do echo "::error::gradle: $line"; done
          fi
          exit "$rc"

      # 把签进包里的那把钥匙的指纹打进日志：以后再出"用户装不上"，第一件事就是
      # 比对两个 Release 的这行输出，而不是靠人回忆签名是哪把。
      # 2026-09-26 换用 apksigner：release 包只有 v2/v3 签名字块、没有 v1 JAR 签名
      # （实测 v0.22 资产 META-INF 下无 *.RSA），keytool -printcert -jarfile 只认 v1，
      # 对着这种包静默输出 "No signers"——grep 接在管道尾把退出码洗成 0，
      # 这一步过去几个版本其实一直在空转。apksigner 才看得见真正的签名。
      - name: Show which key signed this APK
        run: |
          set -eu
          apk=android-native/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
            apksigner="${bt}apksigner"
          fi
          test -x "$apksigner" || { echo "::error::找不到 apksigner（SDK build-tools 缺席？）"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #|SHA-256 digest"

      # R5-AC-4 签名指纹守卫（T1.2）：新包签名指纹 ≠ 上一正式版 → 红，不许发。
      # 为什么钉的是"上一正式版实际用的签名"而不是仓库里抄一个常量：常量会过时，
      # keystore 一旦轮换就得记得改 yml，忘了的那天恰好是守卫最该响的那天；
      # 从上一个真实 Release 的资产现读，参照物永远跟着发布史自己走。
      # 误报豁免：仓库变量 SIGNATURE_GUARD_EXEMPT 精确等于**新包指纹**才放行——
      # 设错值不生效，逼着豁免的人去 CI 日志抄真实指纹；放行时 ::warning:: +
      # 写入 Step Summary，两处留痕（PRD 风险表要求豁免可追溯）。
      - name: "SIGNATURE DRIFT -> 与上一正式版签名不同（豁免见变量 SIGNATURE_GUARD_EXEMPT）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARD_EXEMPT: ${{ vars.SIGNATURE_GUARD_EXEMPT }}
        run: |
          set -uo pipefail
          apk=android-native/app/build/outputs/apk/release/app-release.apk
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)
            apksigner="${bt}apksigner"
          fi
          if [ ! -x "$apksigner" ]; then
            echo "::error::找不到 apksigner，无法核对签名指纹。宁可停，不瞎放行"
            exit 1
          fi
          fp_of() {  # 输出该包 1 号签名者证书的 SHA-256（64 位小写十六进制）
            "$apksigner" verify --print-certs "$1" 2>/dev/null \
              | grep -m1 "certificate SHA-256 digest" \
              | grep -oiE "[0-9a-f]{64}" | head -1 | tr "A-F" "a-f"
          }
          new_fp=$(fp_of "$apk")
          if [ -z "$new_fp" ]; then
            echo "::error::新包里读不到签名指纹（未签名或 apksigner 解析失败）——这种包本来就不该发出去"
            exit 1
          fi
          echo "本次构建签名指纹: $new_fp"
          # 上一正式版 = tag 不等于本次、非草稿非预发布里最近的一个。
          # v0.21/v0.22 资产虽名带 -debug，但覆盖安装判的是签名，不比文件名，
          # 所以拿"最近发布"的证书指纹当参照正是题意。
          tag="${GITHUB_REF_NAME}"
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=20" \
            --jq "[.[] | select(.tag_name != \"${tag}\" and .draft == false and .prerelease == false)][0].tag_name // empty")
          if [ -z "$prev" ]; then
            echo "::warning::找不到上一正式版（首次发布？），本次跳过签名守卫"
            exit 0
          fi
          url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${prev}" \
            --jq "[.assets[] | select(.name | endswith(\".apk\"))][0].browser_download_url // empty")
          if [ -z "$url" ]; then
            echo "::error::Release ${prev} 里没有可下载的 .apk 资产，无从核对指纹"
            exit 1
          fi
          if ! curl -fsSL "$url" -o "$RUNNER_TEMP/prev-release.apk"; then
            echo "::error::下载 ${prev} 的 APK 失败（网络抖动的概率大；重跑本 workflow 即可）"
            exit 1
          fi
          old_fp=$(fp_of "$RUNNER_TEMP/prev-release.apk")
          if [ -z "$old_fp" ]; then
            echo "::error::读不出 ${prev} 包的签名指纹，无法比对"
            exit 1
          fi
          echo "上一正式版 ${prev} 签名指纹: $old_fp"
          if [ "$new_fp" = "$old_fp" ]; then
            echo "::notice::签名指纹与 ${prev} 一致，守卫通过"
            exit 0
          fi
          if [ "${GUARD_EXEMPT:-}" = "$new_fp" ]; then
            echo "::warning::⚠️ 签名指纹漂移已被人工豁免：${prev}=$old_fp 新包=$new_fp。升级用户若装不上必须卸载重装——这是 R5 要消灭的事故，豁免前先确认 keystore 轮换是有意的"
            {
              echo "## ⚠️ 签名守卫人工豁免"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 上一正式版 | \`${prev}\` |"
              echo "| 上版签名指纹 | \`$old_fp\` |"
              echo "| 本次签名指纹 | \`$new_fp\` |"
              echo "| 豁免方式 | 仓库变量 \`SIGNATURE_GUARD_EXEMPT\`（设置该变量的操作在 repo audit log 留痕） |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::新包签名指纹与 ${prev} 不一致：new=$new_fp prev=$old_fp"
          echo "::error::Android 覆盖安装判签名不判版本号，签错钥匙发出去 = 全体老用户必须卸载重装。"
          echo "::error::若确认是 keystore 有意轮换：把上面 new= 的指纹一字不差设为仓库变量 SIGNATURE_GUARD_EXEMPT 再重跑，本步会放行并在 Summary 留痕。"
          echo "::error::若不是有意行为（比如 secret 被换过）：回到 APK_KEYSTORE_BASE64 的源头核对，参考 docs/APK正式签名落地指引.md。"
          exit 1

      - name: Stage APK with a friend-friendly filename
        run: |
          set -eu
          cp android-native/app/build/outputs/apk/release/app-release.apk \
             "ai-assistant-native-${GITHUB_REF_NAME#v}.apk"
          ls -l "ai-assistant-native-${GITHUB_REF_NAME#v}.apk"

      # 手工 Run workflow 只用来验签名链，绝不发版：dispatch 事件里没有 tag，
      # Release 的名字与包里 versionName 无从对上，发出去就是一个名字错乱的公开版本。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          file="ai-assistant-native-${ver}.apk"
          # 每个版本的变更清单单独存一个文件，不焊死在这段 YAML 里。上一版把
          # "v0.13 实测 97,835 字节""从 0.13 起壳自己也有功能了"写进模板，于是往后
          # 每次发版都在替旧版本说话；现在谁发版谁写自己那份 docs/releases/v<版本>.md。
          # 少了这个文件不拦发布（应急发版不该被一段散文挡住）——拦的活儿交给
          # backend/tests/test_release_notes.py，它在 develop 一推送就会红。
          # 文件名跟着 tag 走（带 v），不是跟着 ver 走：ver 是 ${tag#v}，那个 `v` 已经被
          # 剥掉了，写成 ${ver}.md 会去找 docs/releases/0.14.md 而永远找不到——
          # 表现不是报错，是 Release 安静地少掉整份变更清单。
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            { cat "$notes"; printf '\n---\n\n'; } > head.md
          else
            echo "::warning::缺 ${notes}：本次 Release 只有通用说明，没有本版变更清单"
            : > head.md
          fi
          cat > tail.md <<EOF
          ## 安装（安卓）

          1. 下载下面的 \`${file}\`（全原生安卓客户端，约 9 MB——准确体积以 GitHub
             在文件旁标出的数字为准，别信任何散文里写的）
          2. 传到手机后点开安装。系统会提示"禁止安装未知来源应用"——去
             **设置 → 应用 → 允许来自此来源的安装**，勾选一次即可
          3. 打开应用会进入登录界面：已有账号直接登录；没有就点「立即注册」，
             自己填用户名、密码和三道找回题即可开始使用（不需要找任何人要码）
          4. 忘记密码：登录页点「忘记密码」，答对三道找回题就地设新密码、直接续用；
             换手机用同一个用户名再登录一次就行

          ## 这个包是什么

          全原生 Android 客户端：聊天、会话、记忆、设置、提醒都是手机本地实现，
          数据走 \`https://ai.fenever.xyz\` 的后端接口。自 0.21 起推送版只发这个
          原生包；旧的 WebView 壳退役（包名不同，两者本可共存安装）。

          装这一个包就有的能力：

          - **提醒**：设置页里设，到点弹系统通知，手机重启后依然生效。会申请
            「精准闹钟」与通知权限，不给也能用（改用更省电的排期，可能晚几分钟到）
          - **附件**：拍照、相册、分享文件进助手，随消息一起发
          - **检查更新**：设置 → 检查更新，应用内直接查有没有新版
          - **多账号**：设置里可添加/切换身份，聊天记录与长期记忆按账号隔离

          不想装包的人，手机浏览器直接访问 \`https://ai.fenever.xyz/app/\` 照样能用
          网页版——网页版长期保留，与这个包互不影响。
          EOF
          # 实机验收清单挪进各版本自己的 docs/releases/v*.md 了：条数会随版本变，
          # 写死在这里的话下一次加条目时，Release 还在数旧的那 13 条。
          cat head.md tail.md > notes.md
          rm -f head.md tail.md
          # 校验值行：notes 的最后一行是给机器读的契约。后端 /v1/update/info 把
          # 发布正文里那行 `APK-SHA256: <64 位小写十六进制>` 解析出来搭车带给壳，
          # 壳在自己核对下载字节之前不许把包递给安装页——2026-09-23 那次
          # "迅雷劫持成半截残包、人去装报失败"就是没有这一行时可能发生的事。
          # 必须在**签名之后**算：签名过程会改文件，签之前算的摘要和 Release 上
          # 那个字节流永远对不上。缺行或形状不对时壳的行为是"拒装并说清楚"，
          # 不是猜一个值；所以这里算不出来（sha256sum 缺失）就该让这一步红掉。
          set -- $(sha256sum "$file")
          printf '\nAPK-SHA256: %s\n' "$1" >> notes.md
          grep -c '^APK-SHA256: [0-9a-f]\{64\}$' notes.md | grep -q '^1$' \
            || { echo "::error::校验值行没写进去或形状不对，壳会把这版判成不可安装"; exit 1; }
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$file" --title "AI 助手 $ver（安卓原生）" --notes-file notes.md
          fi
