name: Release Android APK

# 打 tag 就出公开 Release：`git push origin v0.10` 之后，任何人都能用固定链接装包。
#
# 为什么不并进 build-apk.yml：那个文件带 `push.paths` 过滤（只在 android/** 变化时
# 出 artifact）。把 tags 和 paths 写在同一个 push 触发器里，paths 会不会把 tag 推送
# 一起挡掉，取决于 GitHub 的过滤语义——这种"能不能触发"的事不该靠猜，所以分开写。
# 两个文件重复的是二十来行 CI 装配步骤，不是产品逻辑。
#
# Release 是公开的（本仓是公开仓库），这正是想要的效果；APK 里不含任何口令，
# 它只是指向 https://ai.fenever.xyz/app/ 的 WebView 壳，装完仍需注册一个账号才能用。
on:
  push:
    tags:
      - "v*"
  # 失败后从 UI 重跑即可：重跑保留原 tag，GITHUB_REF_NAME 仍是 v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # tag 与实际装进 APK 的版本号必须对上，否则发出去的 Release 名字会和包内
      # versionName 不一致，事后谁也说不清用户装的到底是哪一版。
      - name: Check tag matches versionName
        run: |
          set -eu
          declared=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)
          tag=${GITHUB_REF_NAME#v}
          echo "build.gradle versionName=$declared  tag=$tag"
          if [ "$declared" != "$tag" ]; then
            echo "::error::tag 是 v$tag 但 build.gradle 写的是 $declared，两者必须一致"
            exit 1
          fi

      - name: Assemble debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - name: Stage APK with a friend-friendly filename
        run: |
          set -eu
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "ai-assistant-${GITHUB_REF_NAME#v}.apk"
          ls -l "ai-assistant-${GITHUB_REF_NAME#v}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          file="ai-assistant-${ver}.apk"
          # 每个版本的变更清单单独存一个文件，不焊死在这段 YAML 里。上一版把
          # "v0.13 实测 97,835 字节""从 0.13 起壳自己也有功能了"写进模板，于是往后
          # 每次发版都在替旧版本说话；现在谁发版谁写自己那份 docs/releases/v<版本>.md。
          # 少了这个文件不拦发布（应急发版不该被一段散文挡住）——拦的活儿交给
          # backend/tests/test_release_notes.py，它在 develop 一推送就会红。
          # 文件名跟着 tag 走（带 v），不是跟着 ver 走：ver 是 ${tag#v}，那个 `v` 已经被
          # 剥掉了，写成 ${ver}.md 会去找 docs/releases/0.14.md 而永远找不到——
          # 表现不是报错，是 Release 安静地少掉整份变更清单。
          notes="docs/releases/${tag}.md"
          if [ -f "$notes" ]; then
            { cat "$notes"; printf '\n---\n\n'; } > head.md
          else
            echo "::warning::缺 ${notes}：本次 Release 只有通用说明，没有本版变更清单"
            : > head.md
          fi
          cat > tail.md <<EOF
          ## 安装（安卓）

          1. 下载下面的 \`${file}\`（约 100 KB——它只是个壳，因此小到可以直接当文件传给你。
             v0.13 实测 97,835 字节；以前这里写"约 60 KB"，那是 v0.10/v0.11 的体积，
             加了提醒、分享与组件之后已经长到近 100 KB，别再抄旧数字。
             0.15 又加了检查更新那一颗按钮，会比这个数再大一点——
             准确体积看这个文件旁边 GitHub 自己标的那个数，别信这里写的）
          2. 传到手机后点开安装。系统会提示"禁止安装未知来源应用"——去
             **设置 → 应用 → 允许来自此来源的安装**，勾选一次即可
          3. 打开应用，它会提示未登录
          4. 打开后会自动弹出登录界面：切到「注册」，自己填一个用户名和密码即可开始使用
             （不需要找任何人要码）。换手机时用同一个用户名再登录一次就行

          ## 这个包是什么

          一个指向 \`https://ai.fenever.xyz/app/\` 的 WebView 外壳，**不含任何口令或密钥**。
          聊天界面本身仍在服务器上，所以服务端改版你不用重装——打开时加载的就是当前那一版。

          但从 0.13 起壳自己也有功能了，这四件事**只在装了本包的手机上有**：

          - **提醒**：设置 → 设备 → 提醒。到点弹系统通知，手机重启后依然生效。
            提醒存在这台手机上，不上传服务器；可能晚几分钟到（不申请精确闹钟权限）。
          - **分享进助手**：在相册或 PDF 上点「分享」→ 选「AI 助手」，
            文件会挂到助手的附件栏里，不用先存再传。
          - **桌面组件**：主屏放一个小组件，显示今天的提醒，三颗按钮直达拍照提问、
            新对话与检查更新。
          - **检查更新**（0.15 起）：长按桌面图标 →「检查更新」，或点组件上那颗。
            **不点它就不会去拿新安装包**；查出有新版会先问一句，你点下载才开始动流量，
            下完自动弹起系统的安装页。它管的是壳自己的这四件事，
            聊天界面本来就在服务器上，打开即最新、与这个按钮无关。

          因此这一条要改口了：**改界面不用重装，改壳的功能要重装**。
          同一件事在手机浏览器里直接访问 \`https://ai.fenever.xyz/app/\` 也能聊天，
          但上面四项用不了——浏览器拿不到系统通知、分享入口、桌面组件，也起不了安装页。

          注册后你的聊天记录、附件、长期记忆都只归属到你这个账号，别人看不到。
          提醒与待上传的分享件按账号隔离，换账号后看不见上一个人的。
          EOF
          # 实机验收清单挪进各版本自己的 docs/releases/v*.md 了：条数会随版本变，
          # 写死在这里的话下一次加条目时，Release 还在数旧的那 13 条。
          cat head.md tail.md > notes.md
          rm -f head.md tail.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" "$file" --title "AI 助手 $ver（安卓）" --notes-file notes.md
          fi
