name: Build Native Android APK

# 原生（混合）客户端专用构建：与 build-apk.yml 同一策略——
# 本机不装 Android SDK，编译验证完全交给 GitHub runner。
on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/build-native-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Report preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        # T2.5 排障临时：本机无 Android SDK，日志又要鉴权才能读，
        # 所以把编译错误以 ::error:: 注解的形式推到公开 API 上过一次目。
        run: |
          gradle -p android-native --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/assemble.log

      - name: Surface Kotlin errors as annotations
        run: |
          grep -E "^e: |^> Task .*FAILED|error:" /tmp/assemble.log | head -30 > /tmp/errs.txt || true
          sed -i 's/%/%25/g' /tmp/errs.txt || true
          while IFS= read -r line; do echo "::error::${line}"; done < /tmp/errs.txt

      - name: Fail the job when assemble failed
        if: steps.assemble.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-native-debug
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
