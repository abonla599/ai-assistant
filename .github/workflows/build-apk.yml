name: Build Android APK

# 本机没有 Android SDK，也不打算为此装 1.5GB —— GitHub runner 自带。
# 产物是 debug APK（Android 自动用 debug keystore 签名），下载即可安装。
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # 仓库里没有 gradle-wrapper.jar（二进制），因此直接由 action 提供 gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle -p android --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
