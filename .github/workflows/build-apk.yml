name: Build Android APK

# 本机没有 Android SDK，也不打算为此装 1.5GB —— GitHub runner 自带。
# 产物是 debug APK（Android 自动用 debug keystore 签名），下载即可安装。
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 已设好），无需再装。
      # 之前多跑一步 android-actions/setup-android 反而把构建弄挂，故改为只做自检。
      - name: Report preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # 仓库里没有 gradle-wrapper.jar（二进制），因此直接由 action 提供 gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Assemble debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ai-assistant-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
