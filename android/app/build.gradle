plugins {
    id "com.android.application"
}

android {
    namespace "xyz.fenever.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "xyz.fenever.assistant"
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName "0.11"

        // 壳里只钉地址，不写任何口令：公开仓库的 Actions 产物任何人都能下载，
        // 把 ACCESS_TOKEN 编进来等于把助手的付费调用额度公开送人。
        // 口令仍由用户在本机填一次（设置 → 模型服务，管理员那一页），存 WebView 的
        // localStorage；普通人走的是注册/登录，用不到它。
        buildConfigField "String", "APP_URL", "\"https://ai.fenever.xyz/app/\""
    }

    buildTypes {
        debug {
            // CI 出调试包：Android 自动用 debug keystore 签名，装上即用
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // AGP 8 默认关掉 BuildConfig 生成，不开的话 BuildConfig.APP_URL 编译期即报错
        buildConfig true
    }
}

// 零第三方依赖：全部走平台 API，APK 体积只有一个壳该有的大小
