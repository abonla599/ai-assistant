plugins {
    id "com.android.application"
}

android {
    namespace "xyz.fenever.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "xyz.fenever.assistant"
        minSdk 23
        targetSdk 34
        versionCode 21
        versionName "0.21"

        // 壳里只钉地址，不写任何口令：公开仓库的 Actions 产物任何人都能下载，
        // 把 ACCESS_TOKEN 编进来等于把助手的付费调用额度公开送人。
        // 口令仍由用户在本机填一次（设置 → 模型服务，管理员那一页），存 WebView 的
        // localStorage；普通人走的是注册/登录，用不到它。
        buildConfigField "String", "APP_URL", "\"https://ai.fenever.xyz/app/\""
        // 「检查更新」的两个落脚点，与 APP_URL 同源（判据在 backend 的
        // test_android_shell.py：三个值的主机名必须一致）。以前壳直连
        // api.github.com 问版本、把下载地址丢给系统 DownloadManager——2026-09-23
        // 实测被 ROM 的第三方下载通道劫持成"未命名"残包，人拿着半截文件去装，
        // 报"安装失败"。现在问与取都只经过这台服务器，壳自己下、自己校验。
        buildConfigField "String", "UPDATE_INFO_URL", "\"https://ai.fenever.xyz/v1/update/info\""
        buildConfigField "String", "UPDATE_APK_URL", "\"https://ai.fenever.xyz/site/android.apk\""
    }

    signingConfigs {
        release {
            // 签名必须钉死在**同一把**密钥上。Android 覆盖安装判的是签名，不是版本号：
            // CI 之前跑的是 assembleDebug，而 GitHub 的 runner 每次都会现造一把
            // debug keystore——实测 v0.15 与 v0.16 两个 Release 的证书 SHA-256 指纹
            // 就不相同（60f1ded9… 与 8de2fbe3…），于是"检查更新"永远装不上，
            // 只能卸载重装。debug 签名还顺带带着 android:debuggable=true，
            // 那意味着任何能连 adb 的人都能读出壳里存的会话令牌。
            //
            // 密钥从环境变量读，值由 release-apk.yml 从 GitHub Secrets 落盘：
            // 仓库里不留任何密钥文件（公开仓库，留了等于送人）。
            // 没有这些环境变量时这里仍然配得出包（fork 与本地试装用），但那是
            // 未签名/debug 的包——release-apk.yml 缺 secret 会直接失败，
            // 不会把一把新钥匙签的包发给用户。
            def ksPath = System.getenv("APK_KEYSTORE")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("APK_KEYSTORE_PASSWORD")
                keyAlias System.getenv("APK_KEY_ALIAS")
                keyPassword System.getenv("APK_KEY_PASSWORD")
                // 显式写死而不是靠 JDK 默认：tools/make-apk-keystore.ps1 交出来的是
                // PKCS12（文件头 30 82，不是 JKS 的 FE ED）。PKCS12 里"密钥口令"
                // 必须等于库口令，所以那两个 secret 是同一个值——不是笔误。
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        debug {
            // CI 出调试包：Android 自动用 debug keystore 签名，装上即用
        }
        release {
            minifyEnabled false
            // 只有配齐了密钥才挂上去。缺 env 时不挂任何 signingConfig，
            // 产出的是未签名包（fork 与本地试装用），而不是让配置阶段炸掉。
            if (System.getenv("APK_KEYSTORE")) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // AGP 8 默认关掉 BuildConfig 生成，不开的话 BuildConfig.APP_URL 编译期即报错
        buildConfig true
    }
}

// 零第三方依赖：全部走平台 API，APK 体积只有一个壳该有的大小

dependencies {
    // 唯一例外：testImplementation 只进单元测试的 classpath，不进 APK、不进 dex，
    // 所以不违反上面那条。选 JUnit 4 不选 5：AGP 8.5 的 testDebugUnitTest 对 4 开箱即用，
    // 用 5 还要再多拉一层 engine/vintage。
    testImplementation "junit:junit:4.13.2"
}
